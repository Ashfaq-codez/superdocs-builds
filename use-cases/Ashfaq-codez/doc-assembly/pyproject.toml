[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-assembly"
version = "0.1.0"
description = "A document-assembly microservice orchestrating SuperDocs."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]